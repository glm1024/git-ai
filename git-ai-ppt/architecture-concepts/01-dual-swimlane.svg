    <text x="60" y="116" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Arial" font-size="18" font-weight="400" fill="#5B6775"><tspan x="60" dy="0">两条客户端链路保持各自证据模型；进入后端后统一完成候选归因、目标分支确认与统计物化。</tspan></text>
