span><tspan x="448" dy="20">/ Unknown</tspan></text><line x1="591" y1="480" x2="607" y2="480" stroke="#0070C0" stroke-width="3"  marker-end="url(#arrow)"/><rect x="615" y="414" width="155" height="132" rx="16" fill="#F4F5FA" stroke="#8E9BC4" stroke-width="2"/><text x="633" y="448" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Arial" font-size="22" font-weight="700" fill="#213261"><tspan x="633" dy="0">Git Notes</tspan></text><text x="633" y="481" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Arial" font-size="16" font-weight="400" fill="#5B6775"><tspan x="633" dy="0">commit</tspan><tspan x="633" dy="20">/ rewrite</tspan></text><line x1="776" y1="480" x2="792" y2="480" stroke="#0070C0" stroke-width="3"  marker-end="url(#arrow)"/><rect x="800" y="414" width="155" height="132" rx="16" fill="#F4F5FA" stroke="#8E9BC4" stroke-width="2"/><text x="818" y="448" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Arial" font-size="22" font-weight="700" fill="#213261"><tspan x="818" dy="0">独立接入</tspan></text><text x="818" y="481" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Arial" font-size="16" font-weight="400" fill="#5B6775"><tspan x="818" dy="0">metrics/upload</tspan><tspan x="818" dy="20">日累计快照</tspan></text><line x1="962" y1="242" x2="1015" y2="350" stroke="#0070C0" stroke-width="4"  marker-end="url(#arrow)"/><line x1="962" y1="480" x2="1015" y2="372" stroke="#0070C0" stroke-width="4"  marker-end="url(#arrow)"/><rect x="1005" y="285" width="120" height="172" rx="16" fill="#EAF4FB" stroke="#0070C0" stroke-width="2"/><text x="1023" y="319" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Arial" font-size="18" font-weight="700" fill="#213261"><tspan x="1023" dy="0">事实收件</tspan></text><text x="1023" y="352" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Arial" font-size="14" font-weight="400" fill="#5B6775"><tspan x="1023" dy="0">幂等 / ACK</tspan><tspan x="1023" dy="17.5">raw 可重放</tspan></text><line x1="1125" y1="371" x2="1135" y2="371" stroke="#0070C0" stroke-width="3"  marker-end="url(#arrow)"/><rect x="1140" y="285" width="120" height="172" rx="16" fill="#EAF4FB" stroke="#0070C0" stroke-width="2"/><text x="1158" y="319" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Arial" font-size="18" font-weight="700" fill="#213261"><tspan x="1158" dy="0">候选归因</tspan></text><text x="1158" y="352" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Arial" font-size="14" font-weight="400" fill="#5B6775"><tspan x="1158" dy="0">exact / partial</tspan><tspan x="1158" dy="17.5">生命周期替换</tspan></text><line x1="1260" y1="371" x2="1270" y2="371" stroke="#0070C0" stroke-width="3"  marker-end="url(#arrow)"/><rect x="1275" y="285" width="120" height="172" rx="16" fill="#EAF4FB" stroke="#0070C0" stroke-width="2"/><text x="1293" y="319" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Arial" font-size="18" font-weight="700" fill="#213261"><tspan x="1293" dy="0">目标确认</tspan></text><text x="1293" y="352" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Arial" font-size="14" font-weight="400" fill="#5B6775"><tspan x="1293" dy="0">目标分支</tspan><tspan x="1293" dy="17.5">逐行占位去重</tspan></text><line x1="1395" y1="371" x2="1405" y2="371" stroke="#0070C0" stroke-width="3"  marker-end="url(#arrow)"/><rect x="1410" y="285" width="120" height="172" rx="16" fill="#EDF8F1" stroke="#76B68F" stroke-width="2"/><text x="1428" y="319" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Arial" font-size="18" font-weight="700" fill="#2E8B57"><tspan x="1428" dy="0">统计物化</tspan></text><text x="1428" y="352" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Arial" font-size="14" font-weight="400" fill="#5B6775"><tspan x="1428" dy="0">正式 committed</tspan><tspan x="1428" dy="17.5">日汇总 / 看板</tspan></text><rect x="60" y="616" width="1480" height="92" rx="14" fill="#FFF7E8" stroke="#E7B55E" stroke-width="2"/><text x="84" y="651" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Arial" font-size="20" font-weight="700" fill="#D97706"><tspan x="84" dy="0">统计边界</tspan></text><text x="210" y="650" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Arial" font-size="17" font-weight="400" fill="#1F2937"><tspan x="210" dy="0">同一来源内：事件键幂等、候选替换、逐行 claim 去重；只有目标分支确认且逐行证据通过后才形成权威 committed。</tspan><tspan x="210" dy="24.65">跨来源：Kilo v5 与 Git AI 若认领同一最终行，当前不承诺逐行去重；Token 与代码入库归因分开统计。</tspan></text><rect x="60" y="742" width="1480" height="96" rx="14" fill="#F5F9FC" stroke="#AFC4D6" stroke-width="2"/><text x="84" y="777" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Arial" font-size="20" font-weight="700" fill="#213261"><tspan x="84" dy="0">推荐落位</tspan></text><text x="210" y="777" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Arial" font-size="18" font-weight="400" fill="#5B6775"><tspan x="210" dy="0">适合放在“后台适配与统计闭环”章节开头：先给全景，再分别讲后台链路、生命周期、Token 与审计。</tspan></text></svg>