<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#0070C0"/>
      </marker>
      <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
        <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#7A90A4" flood-opacity="0.18"/>
      </filter>
    </defs>
    <rect width="1600" height="900" fill="#FFFFFF"/>
    <rect x="0" y="0" width="1600" height="16" fill="#0070C0"/>
    <text x="60" y="76" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Arial" font-size="34" font-weight="700" fill="#213261"><tspan x="60" dy="0">以“目标 Commit”为中心：先确认真实入库，再反推来源并形成统计</tspan></text>
    <text x="60" y="116" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Arial" font-size="18" font-weight="400" fill="#5B6775"><tspan x="60" dy="0">更强调指标为什么可信：客户端只提供来源证据，目标仓库事实决定何时、以哪个 Commit 正式计入。</tspan></text>
    <rect x="1400" y="44" width="130" height="42" rx="21" fill="#EAF4FB" stroke="#EAF4FB" stroke-width="0"/><text x="1465" y="73" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial" font-size="20" font-weight="700" fill="#0070C0"><tspan x="1465" dy="0">方案 D</tspan></text>
    <line x1="60" y1="140" x2="1540" y2="140" stroke="#AFC4D6" stroke-width="2"/>
  <rect x="65" y="190" width="310" height="145" rx="16" fill="#F5F9FC" stroke="#0070C0" stroke-width="2"/><text x="83" y="224" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Arial" font-size="22" font-weight="700" fill="#213261"><tspan x="83" dy="0">Kilo v5 来源证据</tspan></text><text x="83" y="257" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Arial" font-size="17" font-weight="400" fill="#5B6775"><tspan x="83" dy="0">生成 / 接受 / 候选行</tspan><tspan x="83" dy="21.25">Commit 报告 / 新增行快照</tspan></text><rect x="65" y="395" width="310" height="145" rx="16" fill="#F4F5FA" stroke="#8E9BC4" stroke-width="2"/><text x="83" y="429" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Arial" font-size="22" font-weight="700" fill="#213261"><tspan x="83" dy="0">Git AI 来源证据</tspan></text><text x="83" y="462" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Arial" font-size="17" font-weight="400" fill="#5B6775"><tspan x="83" dy="0">Hook / checkpoint / Git Notes</tspan><tspan x="83" dy="21.25">commit / rewrite / Token 快照</tspan></text><line x1="384" y1="262" x2="560" y2="356" stroke="#0070C0" stroke-width="4"  marker-end="url(#arrow)"/><line x1="384" y1="468" x2="560" y2="374" stroke="#0070C0" stroke-width="4"  marker-end="url(#arrow)"/><rect x="555" y="245" width="370" height="260" rx="24" fill="#EAF4FB" stroke="#0070C0" stroke-width="3"/><text x="740" y="295" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial" font-size="28" font-weight="700" fill="#213261"><tspan x="740" dy="0">规范事实账本</tspan></text><text x="590" y="340" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Arial" font-size="19" font-weight="400" fill="#1F2937"><tspan x="590" dy="0">事件幂等与规范化</tspan><tspan x="590" dy="29.45">候选归因与生命周期替换</tspan><tspan x="590" dy="29.45">来源 lineage 与行级 claim</tspan><tspan x="590" dy="29.45">可重放、可诊断、可重建</tspan></text><line x1="932" y1="375" x2="1050" y2="375" stroke="#0070C0" stroke-width="5"  marker-end="url(#arrow)"/><rect x="1055" y="245" width="255" height="260" rx="24" fill="#FFF7E8" stroke="#E7B55E" stroke-width="3"/><text x="1182" y="296" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial" font-size="28" font-weight="700" fill="#D97706"><tspan x="1182" dy="0">目标 Commit</tspan></text><text x="1182" y="349" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial" font-size="19" font-weight="500" fill="#1F2937"><tspan x="1182" dy="0">仓库扫描</tspan><tspan x="1182" dy="29.45">目标分支可达</tspan><tspan x="1182" dy="29.45">最终新增行</tspan><tspan x="1182" dy="29.45">同批来源确认</tspan></text><rect x="1102" y="447" width="160" height="42" rx="21" fill="#D97706" stroke="#D97706" stroke-width="0"/><text x="1182" y="476" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial" font-size="20" font-weight="700" fill="#FFFFFF"><tspan x="1182" dy="0">权威入库锚点</tspan></text><line x1="1318" y1="375" x2="1380" y2="375" stroke="#0070C0" stroke-width="5"  marker-end="url(#arrow)"/><rect x="1385" y="245" width="150" height="260" rx="16" fill="#EDF8F1" stroke="#76B68F" stroke-width="2"/><text x="1403" y="279" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Arial" font-size="22" font-weight="700" fill="#2E8B57"><tspan x="1403" dy="0">统计输出</tspan></text><text x="1403" y="312" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Arial" font-size="17" font-weight="400" fill="#5B6775"><tspan x="1403" dy="0">AI 贡献率</tspan><tspan x="1403" dy="21.25">入库率</tspan><tspan x="1403" dy="21.25">接受率</tspan><tspan x="1403" dy="21.25">趋势 / 明细</tspan><tspan x="1403" dy="21.25">Commit 审计</tspan></text><rect x="555" y="560" width="980" height="120" rx="14" fill="#FFFFFF" stroke="#AFC4D6" stroke-width="2"/><text x="580" y="596" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Arial" font-size="20" font-weight="700" fill="#213261"><tspan x="580" dy="0">反推关系</tspan></text><text x="700" y="596" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Arial" font-size="17" font-weight="400" fill="#1F2937"><tspan x="700" dy="0">已确认最终行 → 回溯同一批 accepted / generated 来源；本地 commit 只是候选，不能直接当作最终入库。</tspan><tspan x="700" dy="24.65">amend / rebase / reset 只影响未确认候选；已确认事实以后端目标分支真实历史为准。</tspan></text><rect x="65" y="720" width="1470" height="90" rx="14" fill="#FFF0EF" stroke="#E29A96" stroke-width="2"/><text x="90" y="754" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Arial" font-size="20" font-weight="700" fill="#C73E3A"><tspan x="90" dy="0">适用性判断</tspan></text><text x="220" y="753" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Arial" font-size="17" font-weight="400" fill="#1F2937"><tspan x="220" dy="0">优点：最能解释“为什么统计可信”。代价：系统组件拓扑不如方案 C 完整；适合作为技术结论页，不一定适合作为唯一总体架构页。</tspan></text></svg>